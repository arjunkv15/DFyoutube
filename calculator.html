<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
    .calculator { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 260px; }
    #display { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; padding: 10px; background-color: #f9f9f9;}
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button { padding: 15px 10px; font-size: 18px; cursor: pointer; border: none; background: #eee; border-radius: 4px; transition: background 0.2s; }
    button:hover { background: #ddd; }
    .operator { background: #ff9800; color: white; }
    .operator:hover { background: #e68a00; }
    .clear { grid-column: span 4; background: #f44336; color: white; }
    .clear:hover { background: #da190b; }
</style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button onclick="clearDisplay()" class="clear">C</button>
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('-')" class="operator">-</button>
        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button onclick="calculate()" class="operator">=</button>
        <button onclick="appendValue('+')" class="operator">+</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = '';
    }

    function calculate() {
        try {
            if (display.value) {
                // Using Function as a safer alternative to eval
                display.value = new Function('return ' + display.value)();
            }
        } catch (error) {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
